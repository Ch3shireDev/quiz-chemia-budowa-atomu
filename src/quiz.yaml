        text: '$3$'
        explanation: 'Dla $n = 3$: $3 \cdot 12 + 8 = 44\ \mathrm{u}$ – za mało.'
      - key: 'B'
        text: '$4$'
        explanation: '**Dobrze.** $12n + (2n + 2) = 58 \Rightarrow 14n = 56 \Rightarrow n = 4$. To butan, $\mathrm{C_4H_{10}}$.'
      - key: 'C'
        text: '$5$'
        explanation: 'Dla $n = 5$: $5 \cdot 12 + 12 = 72\ \mathrm{u}$ – za dużo.'
      - key: 'D'
        text: '$6$'
        explanation: 'Dla $n = 6$: $6 \cdot 12 + 14 = 86\ \mathrm{u}$ – zdecydowanie za dużo.'

  - id: 45
    topic: 'Masa cząsteczkowa'
    difficulty: 'trudny'
    question: 'Tlenek siarki o wzorze $\mathrm{SO}_x$ ma masę cząsteczkową $80\ \mathrm{u}$. Ile wynosi $x$? ($\mathrm{S} = 32\ \mathrm{u}$, $\mathrm{O} = 16\ \mathrm{u}$)'
    correct: 'D'
    answers:
      - key: 'A'
        text: '$5$'
        explanation: 'Podzielono $80$ przez $16$ i zapomniano o siarce: $80 : 16 = 5$.'
      - key: 'B'
        text: '$2$'
        explanation: '$\mathrm{SO_2}$ ma $32 + 32 = 64\ \mathrm{u}$, a nie $80\ \mathrm{u}$.'
      - key: 'C'
        text: '$4$'
        explanation: '$\mathrm{SO_4}$ miałby $32 + 64 = 96\ \mathrm{u}$ – za dużo.'
      - key: 'D'
        text: '$3$'
        explanation: '**Dobrze.** $32 + 16x = 80 \Rightarrow 16x = 48 \Rightarrow x = 3$, czyli $\mathrm{SO_3}$.'

