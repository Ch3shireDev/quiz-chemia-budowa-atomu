# Teksty są renderowane jako Markdown + LaTeX (KaTeX, bez mhchem – \ce nie działa).
# Wzory chemiczne: $\mathrm{H_{2}SO_{4}}$, izotopy: ${}^{23}_{11}\mathrm{Na}$, liczby: $1{,}66 \cdot 10^{-24}\ \mathrm{g}$.
# UWAGA: używaj pojedynczych cudzysłowów ('...'), bo w podwójnych YAML zjada backslashe.
# Apostrof w środku tekstu zapisuje się jako dwa apostrofy: ''.

quiz:
  title: 'Budowa atomu i masy atomowe'
  level: '1 klasa liceum, poziom podstawowy'
  constants:
    u_in_grams: '$1\ \mathrm{u} \approx 1{,}66 \cdot 10^{-24}\ \mathrm{g}$'
    atomic_masses_note: 'W obliczeniach przyjęto zaokrąglone masy atomowe: $\mathrm{H} = 1\ \mathrm{u}$, $\mathrm{C} = 12\ \mathrm{u}$, $\mathrm{O} = 16\ \mathrm{u}$, $\mathrm{S} = 32\ \mathrm{u}$, $\mathrm{Ca} = 40\ \mathrm{u}$ (chyba że pytanie podaje inaczej).'

questions:
  - id: 1
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Z jakich cząstek zbudowane jest **jądro atomowe**?'
    correct: 'B'
    answers:
      - key: 'A'
        text: 'Z protonów i elektronów'
        explanation: 'Elektrony nie siedzą w jądrze – tworzą chmurę elektronową wokół niego.'
      - key: 'B'
        text: 'Z protonów i neutronów'
        explanation: '**Dobrze.** Protony i neutrony (razem: *nukleony*) tworzą jądro atomowe.'
      - key: 'C'
        text: 'Z neutronów i elektronów'
        explanation: 'Elektrony są poza jądrem, a bez protonów jądro nie miałoby ładunku dodatniego.'
      - key: 'D'
        text: 'Wyłącznie z protonów'
        explanation: 'Tak wygląda tylko jądro najpopularniejszego izotopu wodoru, ${}^{1}\mathrm{H}$. Pozostałe jądra zawierają też neutrony.'

  - id: 2
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Liczba atomowa $Z$ określa:'
    correct: 'C'
    answers:
      - key: 'A'
        text: 'liczbę neutronów w jądrze'
        explanation: 'Liczbę neutronów obliczamy jako $A - Z$, sama $Z$ jej nie podaje.'
      - key: 'B'
        text: 'sumę protonów i neutronów w jądrze'
        explanation: 'To definicja liczby **masowej** $A$, nie atomowej.'
      - key: 'C'
        text: 'liczbę protonów w jądrze'
        explanation: '**Dobrze.** $Z$ to liczba protonów, a w atomie obojętnym także liczba elektronów.'
      - key: 'D'
        text: 'masę atomu wyrażoną w unitach'
        explanation: 'Masa atomu to zupełnie inna wielkość – $Z$ jest liczbą całkowitą, która tylko liczy protony.'

  - id: 3
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Liczba masowa $A$ to:'
    correct: 'A'
    answers:
      - key: 'A'
        text: 'suma liczby protonów i neutronów w jądrze'
        explanation: '**Dobrze.** $A = p^+ + n^0$, czyli liczba nukleonów.'
      - key: 'B'
        text: 'suma liczby protonów i elektronów'
        explanation: 'Elektrony mają znikomą masę i nie są wliczane do liczby masowej.'
      - key: 'C'
        text: 'liczba neutronów w jądrze'
        explanation: 'Liczba neutronów to $A - Z$, a nie samo $A$.'
      - key: 'D'
        text: 'średnia masa atomowa z układu okresowego'
        explanation: 'Średnia masa atomowa jest zwykle ułamkowa i dotyczy pierwiastka, a liczba masowa jest całkowita i dotyczy konkretnego izotopu.'

  - id: 4
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Ile **neutronów** zawiera jądro atomu ${}^{23}_{11}\mathrm{Na}$?'
    correct: 'D'
    answers:
      - key: 'A'
        text: '$11$'
        explanation: '$11$ to liczba protonów ($Z$), nie neutronów.'
      - key: 'B'
        text: '$23$'
        explanation: '$23$ to liczba masowa – suma protonów i neutronów.'
      - key: 'C'
        text: '$34$'
        explanation: 'Dodano $A$ i $Z$ zamiast je odjąć: $23 + 11 = 34$.'
      - key: 'D'
        text: '$12$'
        explanation: '**Dobrze.** $n^0 = A - Z = 23 - 11 = 12$.'

  - id: 5
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Jaki jest ładunek jądra atomu ${}^{27}_{13}\mathrm{Al}$?'
    correct: 'B'
    answers:
      - key: 'A'
        text: '$+27$'
        explanation: '$27$ to liczba nukleonów, ale neutrony nie mają ładunku, więc nie liczą się do ładunku jądra.'
      - key: 'B'
        text: '$+13$'
        explanation: '**Dobrze.** Ładunek jądra wynika wyłącznie z protonów, a jest ich $Z = 13$.'
      - key: 'C'
        text: '$+14$'
        explanation: '$14$ to liczba neutronów ($27 - 13$), a neutrony są obojętne elektrycznie.'
      - key: 'D'
        text: '$0$'
        explanation: 'Obojętny jest cały atom (protony równoważą elektrony), ale samo jądro jest naładowane dodatnio.'

  - id: 6
    topic: 'Jądro atomowe'
    difficulty: 'podstawowy'
    question: 'Izotopy tego samego pierwiastka różnią się:'
    correct: 'A'
    answers:
      - key: 'A'
        text: 'liczbą neutronów w jądrze'
        explanation: '**Dobrze.** Izotopy mają tę samą liczbę protonów, ale różną liczbę neutronów, a więc różną liczbę masową, np. ${}^{35}\mathrm{Cl}$ i ${}^{37}\mathrm{Cl}$.'
      - key: 'B'
        text: 'liczbą protonów w jądrze'
        explanation: 'Inna liczba protonów oznacza **inny pierwiastek**, a nie inny izotop.'
      - key: 'C'
        text: 'liczbą elektronów w atomie obojętnym'
        explanation: 'W atomie obojętnym liczba elektronów = liczba protonów, więc dla izotopów jest taka sama.'
      - key: 'D'
        text: 'ładunkiem jądra'
        explanation: 'Ładunek jądra zależy od liczby protonów, a ta jest dla izotopów jednakowa.'

  - id: 7
    topic: 'Jądro atomowe'
    difficulty: 'średni'
    question: 'Atom zawiera w jądrze $17$ protonów i $18$ neutronów. Który zapis go opisuje?'
    correct: 'C'
    answers:
      - key: 'A'
        text: '${}^{35}_{18}\mathrm{Ar}$'
        explanation: 'Argon ma $18$ protonów. Tu $18$ to liczba neutronów, a nie $Z$.'
      - key: 'B'
        text: '${}^{18}_{17}\mathrm{Cl}$'
        explanation: 'W górnym indeksie wpisano liczbę neutronów zamiast liczby masowej ($17 + 18 = 35$).'
      - key: 'C'
        text: '${}^{35}_{17}\mathrm{Cl}$'
        explanation: '**Dobrze.** $Z = 17$ to chlor, $A = 17 + 18 = 35$.'
      - key: 'D'
        text: '${}^{17}_{35}\mathrm{Br}$'
        explanation: 'Indeksy zamienione miejscami i do tego zły pierwiastek. Liczba masowa nie może być mniejsza od atomowej.'

  - id: 8
    topic: 'Jądro atomowe'
    difficulty: 'średni'
    question: 'Które zdanie o jądrze atomowym jest **prawdziwe**?'
    correct: 'D'
    answers:
      - key: 'A'
        text: 'Jądro zajmuje większość objętości atomu'
        explanation: 'Odwrotnie – średnica jądra jest ok. $10^4$–$10^5$ razy mniejsza od średnicy atomu. Atom to głównie pusta przestrzeń.'
      - key: 'B'
        text: 'Masa jądra stanowi mniej więcej połowę masy atomu'
        explanation: 'Elektrony są bardzo lekkie, więc jądro to ponad $99{,}9\%$ masy atomu.'
      - key: 'C'
        text: 'Jądro ma ładunek ujemny'
        explanation: 'Jądro zawiera protony ($+$) i neutrony ($0$), więc jego ładunek jest dodatni.'
      - key: 'D'
        text: 'Jądro jest bardzo małe, ale skupia prawie całą masę atomu'
        explanation: '**Dobrze.** Protony i neutrony są ok. $1836$ razy cięższe od elektronu, więc niemal cała masa siedzi w maleńkim jądrze.'

  - id: 9
    topic: 'Budowa atomu'
    difficulty: 'podstawowy'
    question: 'Masa **elektronu** w porównaniu z masą protonu jest:'
    correct: 'B'
    answers:
      - key: 'A'
        text: 'taka sama'
        explanation: 'Taka sama jest tylko wartość bezwzględna ładunku ($+1$ i $-1$), masa już nie.'
      - key: 'B'
        text: 'około $1836$ razy mniejsza'
        explanation: '**Dobrze.** Dlatego masę elektronów zwykle pomija się przy liczeniu masy atomu.'
      - key: 'C'
        text: 'około $1836$ razy większa'
        explanation: 'Odwrotnie – to proton jest ok. $1836$ razy cięższy od elektronu.'
      - key: 'D'
        text: 'około $2$ razy mniejsza'
        explanation: 'Różnica jest o kilka rzędów wielkości większa.'

  - id: 10
    topic: 'Masa bezwzględna'
    difficulty: 'podstawowy'
    question: 'Atomowa jednostka masy ($1\ \mathrm{u}$) jest zdefiniowana jako:'
    correct: 'C'
    answers:
      - key: 'A'
        text: 'masa jednego protonu'
        explanation: 'Masa protonu jest bliska $1\ \mathrm{u}$ (ok. $1{,}007\ \mathrm{u}$), ale nie jest jej definicją.'
      - key: 'B'
        text: 'masa atomu wodoru'
        explanation: 'Atom wodoru ma masę ok. $1{,}008\ \mathrm{u}$. Wodór był kiedyś wzorcem, ale obecnie nim nie jest.'
      - key: 'C'
        text: '$\frac{1}{12}$ masy atomu węgla ${}^{12}\mathrm{C}$'
        explanation: '**Dobrze.** Wzorcem jest izotop węgla-12, a $1\ \mathrm{u}$ to dwunasta część jego masy.'
      - key: 'D'
        text: '$\frac{1}{16}$ masy atomu tlenu'
        explanation: 'Tlen był wzorcem w przeszłości, ale obecnie obowiązuje węgiel-12.'

  - id: 11
    topic: 'Masa bezwzględna'
    difficulty: 'podstawowy'
    question: 'Ile w przybliżeniu wynosi $1\ \mathrm{u}$ wyrażony **w gramach**?'
    correct: 'A'
    answers:
      - key: 'A'
        text: '$1{,}66 \cdot 10^{-24}\ \mathrm{g}$'
        explanation: '**Dobrze.** $1\ \mathrm{u} \approx 1{,}66 \cdot 10^{-24}\ \mathrm{g}$.'
      - key: 'B'
        text: '$1{,}66 \cdot 10^{-27}\ \mathrm{g}$'
        explanation: 'Liczba poprawna, jednostka nie – $1{,}66 \cdot 10^{-27}$ to wartość w **kilogramach**, nie w gramach.'
      - key: 'C'
        text: '$6{,}02 \cdot 10^{23}\ \mathrm{g}$'
        explanation: '$6{,}02 \cdot 10^{23}$ to liczba Avogadra, a nie masa. Gdyby jeden unit ważył tyle, atom byłby cięższy od planety.'
      - key: 'D'
        text: '$1\ \mathrm{g}$'
        explanation: '$1\ \mathrm{g}$ to masa ok. $6{,}02 \cdot 10^{23}$ unitów – pojedyncze atomy są nieporównanie lżejsze.'

  - id: 12
    topic: 'Masa bezwzględna'
    difficulty: 'średni'
    question: 'Oblicz masę bezwzględną atomu węgla ${}^{12}\mathrm{C}$ w gramach.'
    correct: 'D'
    answers:
      - key: 'A'
        text: '$12\ \mathrm{g}$'
        explanation: '$12\ \mathrm{g}$ to masa jednego **mola** atomów węgla, czyli ok. $6{,}02 \cdot 10^{23}$ atomów, a nie jednego.'
      - key: 'B'
        text: '$1{,}38 \cdot 10^{-25}\ \mathrm{g}$'
        explanation: 'Podzielono $1{,}66 \cdot 10^{-24}\ \mathrm{g}$ przez $12$ zamiast pomnożyć.'
      - key: 'C'
        text: '$7{,}22 \cdot 10^{24}\ \mathrm{g}$'
        explanation: 'Pomnożono $12$ przez liczbę Avogadra – wynik nie ma sensu fizycznego dla jednego atomu.'
      - key: 'D'
        text: '$1{,}99 \cdot 10^{-23}\ \mathrm{g}$'
        explanation: '**Dobrze.** $m = 12 \cdot 1{,}66 \cdot 10^{-24}\ \mathrm{g} = 19{,}92 \cdot 10^{-24}\ \mathrm{g} \approx 1{,}99 \cdot 10^{-23}\ \mathrm{g}$.'

  - id: 13
    topic: 'Masa bezwzględna'
    difficulty: 'średni'
    question: 'Oblicz masę bezwzględną cząsteczki tlenu $\mathrm{O_{2}}$ w gramach ($\mathrm{O} = 16\ \mathrm{u}$).'
    correct: 'B'
    answers:
      - key: 'A'
        text: '$2{,}66 \cdot 10^{-23}\ \mathrm{g}$'
        explanation: 'To masa **jednego atomu** tlenu ($16\ \mathrm{u}$). Cząsteczka $\mathrm{O_{2}}$ ma dwa atomy, czyli $32\ \mathrm{u}$.'
      - key: 'B'
        text: '$5{,}31 \cdot 10^{-23}\ \mathrm{g}$'
        explanation: '**Dobrze.** $32 \cdot 1{,}66 \cdot 10^{-24}\ \mathrm{g} = 53{,}12 \cdot 10^{-24}\ \mathrm{g} \approx 5{,}31 \cdot 10^{-23}\ \mathrm{g}$.'
      - key: 'C'
        text: '$5{,}31 \cdot 10^{-26}\ \mathrm{g}$'
        explanation: 'Pomylono jednostki – $5{,}31 \cdot 10^{-26}$ to wynik w **kilogramach**, a nie w gramach.'
      - key: 'D'
        text: '$32\ \mathrm{g}$'
        explanation: '$32\ \mathrm{g}$ to masa mola cząsteczek $\mathrm{O_{2}}$, a nie jednej cząsteczki.'

  - id: 14
    topic: 'Masa bezwzględna'
    difficulty: 'trudny'
    question: 'Masa bezwzględna atomu pewnego pierwiastka wynosi $3{,}82 \cdot 10^{-23}\ \mathrm{g}$. Który to pierwiastek?'
    correct: 'C'
    answers:
      - key: 'A'
        text: 'Wanad ($\mathrm{V}$)'
        explanation: 'Pułapka: wanad ma liczbę **atomową** $23$, ale jego masa atomowa to ok. $51\ \mathrm{u}$. Wynik $23$ to masa w unitach, nie $Z$.'
      - key: 'B'
        text: 'Magnez ($\mathrm{Mg}$)'
        explanation: 'Magnez ma masę ok. $24\ \mathrm{u}$. Wynik obliczeń to ok. $23\ \mathrm{u}$ – blisko, ale to inny pierwiastek.'
      - key: 'C'
        text: 'Sód ($\mathrm{Na}$)'
        explanation: '**Dobrze.** $m = \dfrac{3{,}82 \cdot 10^{-23}\ \mathrm{g}}{1{,}66 \cdot 10^{-24}\ \mathrm{g/u}} \approx 23\ \mathrm{u}$, a taką masę atomową ma sód.'
      - key: 'D'
        text: 'Neon ($\mathrm{Ne}$)'
        explanation: 'Neon ma masę ok. $20\ \mathrm{u}$ – za mało.'

  - id: 15
    topic: 'Masa cząsteczkowa'
    difficulty: 'podstawowy'
    question: 'Oblicz masę cząsteczkową wody $\mathrm{H_{2}O}$ ($\mathrm{H} = 1\ \mathrm{u}$, $\mathrm{O} = 16\ \mathrm{u}$).'
    correct: 'A'
    answers:
      - key: 'A'
        text: '$18\ \mathrm{u}$'
        explanation: '**Dobrze.** $2 \cdot 1\ \mathrm{u} + 16\ \mathrm{u} = 18\ \mathrm{u}$.'
      - key: 'B'
        text: '$17\ \mathrm{u}$'
        explanation: 'Policzono tylko jeden atom wodoru. Indeks $2$ oznacza dwa atomy $\mathrm{H}$.'
      - key: 'C'
        text: '$10\ \mathrm{u}$'
        explanation: 'Zsumowano liczby **atomowe** ($1 + 1 + 8$) zamiast mas atomowych.'
      - key: 'D'
        text: '$33\ \mathrm{u}$'
        explanation: 'Indeks $2$ przypisano do tlenu zamiast do wodoru: $1 + 2 \cdot 16 = 33$.'

  - id: 16
    topic: 'Masa cząsteczkowa'
    difficulty: 'podstawowy'
    question: 'Oblicz masę cząsteczkową kwasu siarkowego(VI) $\mathrm{H_{2}SO_{4}}$ ($\mathrm{H} = 1\ \mathrm{u}$, $\mathrm{S} = 32\ \mathrm{u}$, $\mathrm{O} = 16\ \mathrm{u}$).'
    correct: 'D'
    answers:
      - key: 'A'
        text: '$49\ \mathrm{u}$'
        explanation: 'Pominięto wszystkie indeksy: $1 + 32 + 16 = 49$.'
      - key: 'B'
        text: '$82\ \mathrm{u}$'
        explanation: 'Policzono tylko trzy atomy tlenu (jak w $\mathrm{H_{2}SO_{3}}$): $2 + 32 + 48 = 82$.'
      - key: 'C'
        text: '$66\ \mathrm{u}$'
        explanation: 'Policzono tylko dwa atomy tlenu: $2 + 32 + 32 = 66$.'
      - key: 'D'
        text: '$98\ \mathrm{u}$'
        explanation: '**Dobrze.** $2 \cdot 1 + 32 + 4 \cdot 16 = 2 + 32 + 64 = 98\ \mathrm{u}$.'

  - id: 17
    topic: 'Masa cząsteczkowa'
    difficulty: 'średni'
    question: 'Oblicz masę cząsteczkową wodorotlenku wapnia $\mathrm{Ca(OH)_{2}}$ ($\mathrm{Ca} = 40\ \mathrm{u}$, $\mathrm{O} = 16\ \mathrm{u}$, $\mathrm{H} = 1\ \mathrm{u}$).'
    correct: 'B'
    answers:
      - key: 'A'
        text: '$57\ \mathrm{u}$'
        explanation: 'Zignorowano indeks za nawiasem: $40 + 16 + 1 = 57$.'
      - key: 'B'
        text: '$74\ \mathrm{u}$'
        explanation: '**Dobrze.** Indeks za nawiasem mnoży całą grupę $\mathrm{OH}$: $40 + 2 \cdot (16 + 1) = 74\ \mathrm{u}$.'
      - key: 'C'
        text: '$58\ \mathrm{u}$'
        explanation: 'Indeks $2$ zastosowano tylko do wodoru: $40 + 16 + 2 = 58$. Nawias obejmuje także tlen.'
      - key: 'D'
        text: '$76\ \mathrm{u}$'
        explanation: 'Policzono za dużo atomów wodoru: $40 + 32 + 4 = 76$. Wodory są tylko dwa.'

  - id: 18
    topic: 'Masa cząsteczkowa'
    difficulty: 'trudny'
    question: 'Masa cząsteczkowa tlenku o wzorze $\mathrm{E_{2}O_{3}}$ wynosi $160\ \mathrm{u}$. Jaki pierwiastek oznaczono jako $\mathrm{E}$? ($\mathrm{O} = 16\ \mathrm{u}$)'
    correct: 'A'
    answers:
      - key: 'A'
        text: 'Żelazo ($\mathrm{Fe}$)'
        explanation: '**Dobrze.** $2E + 3 \cdot 16 = 160 \Rightarrow 2E = 112 \Rightarrow E = 56\ \mathrm{u}$, czyli żelazo ($\mathrm{Fe_{2}O_{3}}$).'
      - key: 'B'
        text: 'Glin ($\mathrm{Al}$)'
        explanation: '$\mathrm{Al_{2}O_{3}}$ ma masę $2 \cdot 27 + 48 = 102\ \mathrm{u}$, a nie $160\ \mathrm{u}$.'
      - key: 'C'
        text: 'Kadm ($\mathrm{Cd}$)'
        explanation: 'Zapomniano, że atomy E są dwa: $E + 48 = 160 \Rightarrow E = 112$ (kadm). Trzeba było podzielić $112$ przez $2$.'
      - key: 'D'
        text: 'Chrom ($\mathrm{Cr}$)'
        explanation: '$\mathrm{Cr_{2}O_{3}}$ ma masę $2 \cdot 52 + 48 = 152\ \mathrm{u}$ – blisko, ale to nie $160\ \mathrm{u}$.'

  - id: 19
    topic: 'Średnia masa atomowa'
    difficulty: 'podstawowy'
    question: 'Dlaczego masy atomowe pierwiastków w układzie okresowym są zwykle liczbami **ułamkowymi**?'
    correct: 'C'
    answers:
      - key: 'A'
        text: 'Bo układ okresowy podaje wartości przybliżone z błędem pomiaru'
        explanation: 'Dokładność pomiaru nie ma tu nic do rzeczy – ułamki wynikają z mieszaniny izotopów.'
      - key: 'B'
        text: 'Bo w jądrze znajdują się ułamkowe części protonów'
        explanation: 'W jądrze nie ma „połówek protonów” – liczba nukleonów zawsze jest całkowita.'
      - key: 'C'
        text: 'Bo jest to średnia ważona mas izotopów występujących w przyrodzie'
        explanation: '**Dobrze.** Większość pierwiastków to mieszanina izotopów, a masa atomowa uwzględnia ich procentowy udział.'
      - key: 'D'
        text: 'Bo do masy atomu dolicza się masę elektronów'
        explanation: 'Elektrony mają tak małą masę, że nie tłumaczą ułamkowych wartości (np. $35{,}5\ \mathrm{u}$ dla chloru).'

  - id: 20
    topic: 'Średnia masa atomowa'
    difficulty: 'średni'
    question: 'Chlor występuje w przyrodzie jako mieszanina izotopów: ${}^{35}\mathrm{Cl}$ (75%) i ${}^{37}\mathrm{Cl}$ (25%). Oblicz średnią masę atomową chloru.'
    correct: 'B'
    answers:
      - key: 'A'
        text: '$36\ \mathrm{u}$'
        explanation: 'To zwykła średnia arytmetyczna $\frac{35 + 37}{2}$. Trzeba uwzględnić udział procentowy izotopów.'
      - key: 'B'
        text: '$35{,}5\ \mathrm{u}$'
        explanation: '**Dobrze.** $\dfrac{35 \cdot 75 + 37 \cdot 25}{100} = \dfrac{2625 + 925}{100} = 35{,}5\ \mathrm{u}$.'
      - key: 'C'
        text: '$36{,}5\ \mathrm{u}$'
        explanation: 'Zamieniono udziały procentowe izotopów: $\frac{35 \cdot 25 + 37 \cdot 75}{100} = 36{,}5$.'
      - key: 'D'
        text: '$72\ \mathrm{u}$'
        explanation: 'Dodano masy obu izotopów ($35 + 37$) i na tym zakończono obliczenia.'

  - id: 21
    topic: 'Średnia masa atomowa'
    difficulty: 'średni'
    question: 'Miedź składa się z izotopów ${}^{63}\mathrm{Cu}$ (69%) i ${}^{65}\mathrm{Cu}$ (31%). Oblicz średnią masę atomową miedzi.'
    correct: 'D'
    answers:
      - key: 'A'
        text: '$64{,}00\ \mathrm{u}$'
        explanation: 'Średnia arytmetyczna $\frac{63 + 65}{2}$. Izotopy nie występują po równo, więc trzeba liczyć średnią **ważoną**.'
      - key: 'B'
        text: '$64{,}38\ \mathrm{u}$'
        explanation: 'Zamieniono udziały: $\frac{63 \cdot 31 + 65 \cdot 69}{100} = 64{,}38$. Wynik powinien być bliżej masy izotopu, którego jest więcej.'
      - key: 'C'
        text: '$63{,}00\ \mathrm{u}$'
        explanation: 'Uwzględniono tylko izotop przeważający, pomijając ${}^{65}\mathrm{Cu}$.'
      - key: 'D'
        text: '$63{,}62\ \mathrm{u}$'
